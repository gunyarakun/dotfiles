# macOS-only config, loaded through auto_env in .miserc.toml

[dotfiles]
# vscode (merge: VS Code writes its own keys into settings.json)
"~/Library/Application Support/Code/User/settings.json/dotfiles" = { source = "vscode/settings.json", merge = true }
"~/Library/Application Support/Code/User/keybindings.json" = "vscode/keybindings.json"

[bootstrap.hooks]
# settings.json was a symlink into this repo before mise; make it a real file for merge
pre-dotfiles = """
target="$HOME/Library/Application Support/Code/User/settings.json"
case $(readlink "$target") in
  '{{ config_root }}'/*|./vscode/*) cp "$target" "$target.tmp" 2>/dev/null && mv "$target.tmp" "$target" || rm -f "$target" ;;
esac
"""
post-packages = "brew services list | grep -q '^ollama .*started' || brew services start ollama"

# Upgrade formulae every morning (replaces `brew autoupdate`), restarting
# ollama when it was upgraded. Casks are left out: some need sudo, which has no
# terminal here, and most update themselves.
[bootstrap.macos.launchd.agents.mise-packages-upgrade]
program = "/bin/sh"
args = ["-c", """
before=$(brew list --versions ollama)
~/.local/bin/mise -C '{{ config_root }}' bootstrap packages upgrade --manager brew --yes
[ "$(brew list --versions ollama)" = "$before" ] || brew services restart ollama
"""]
start_calendar_interval = [{ hour = 9, minute = 0 }]
environment = { PATH = "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/mise-packages-upgrade.log"
stderr_path = "~/Library/Logs/mise-packages-upgrade.log"

